<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Catalog prețuri cablare structurată</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div class="app" id="app">
<div id="band"></div>
<header class="hdr">
<div class="c-search">
<label class="sr" for="qc">Caută în catalog</label>
<input id="qc" class="search" type="search" placeholder="Caută: rack 42U, OS2 12 fibre, colier 200, holtșurub 8x80…" autocomplete="off" spellcheck="false">
</div>
<div class="c-add" id="addwrap" hidden><button type="button" class="add-btn" aria-label="Adaugă produs" data-act="add"><span class="add-long">+ Adaugă produs</span><span class="add-short" aria-hidden="true">+</span></button></div>
<div class="c-vat seg" role="group" aria-label="Afișare prețuri">
<button type="button" id="vat0" data-act="vat0">fără TVA</button>
<button type="button" id="vat1" data-act="vat1">cu TVA</button>
</div>
<div class="c-meta meta" id="meta"></div>
<button type="button" class="c-theme theme-btn" id="themebtn" data-act="theme"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"></circle><path class="ic-bg" d="M8 2.2a5.8 5.8 0 0 0 0 11.6z"></path></svg></button>
<div class="c-filt"><button type="button" class="filt-btn" id="filtbtn" aria-expanded="false" data-act="panel-open">Filtre</button></div>
</header>
<div class="main">
<aside class="fpanel" id="fpanel" aria-label="Filtre"></aside>
<div class="content" id="content"></div>
</div>
<div id="toast"></div>
<div id="dlg"></div>
</div>
<noscript><p style="padding:16px">Catalogul are nevoie de JavaScript.</p></noscript>
<script src="app.js?v=2"></script>
</body>
</html>
